const MON=["January","February","March","April","May","June","July","August","September","October","November","December"],DOW=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pad=n=>n<10?"0"+n:""+n;let view="nov",showCP=true,sel=DATA.today;

function byDay(){const o={};DATA.items.forEach(i=>{if(!showCP&&i.type==="Community")return;(o[i.date]=o[i.date]||[]).push(i)});return o}
function short(t){return t.replace(":00","").replace(" PM","p").replace(" AM","a")}
function month(y,m,bd){const first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();
 const n=DATA.items.filter(i=>i.date.startsWith(y+"-"+pad(m+1))&&i.type!=="Community").length;
 let h=`<div class="mtitle">${MON[m]} ${y}<span>${n} video posts on record</span></div><div class="grid">`;
 DOW.forEach(d=>h+=`<div class="dow"><span class="dowl">${d}</span><span class="dows">${d[0]}</span></div>`);
 let cells=[];for(let i=0;i<first;i++)cells.push(0);for(let d=1;d<=days;d++)cells.push(d);while(cells.length%7)cells.push(0);
 cells.forEach(d=>{if(!d){h+='<div class="day out"></div>';return}
  const ds=`${y}-${pad(m+1)}-${pad(d)}`,L=bd[ds]||[],cls=["day"];if(ds===DATA.today)cls.push("today");else if(ds<DATA.today)cls.push("past");if(ds===sel)cls.push("sel");
